<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EasyBuy4Me</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: desktop = guide panel + 390x844 phone frame; phone width = app fills screen. Palette comes from the logo maroon. */
:root{
  --brand:#910303; --brand-deep:#5C0202; --brand-text:#910303; --brand-soft:#F8E7E4; --on-brand:#FFFFFF;
  --bg:#FAF6F4; --surface:#FFFFFF; --surface-2:#F3ECE9; --ink:#241617; --ink-2:#5F5051; --ink-3:#8A7B7B; --line:#E9DFDB;
  --save:#16764A; --save-soft:#E0F2E8; --warn:#A85F00; --warn-soft:#FBEED6; --bad:#B3261E; --bad-soft:#FBE3E0;
  --page:#EDE4E0; --logo:#910303; --shadow:0 1px 2px rgba(60,20,20,.08),0 6px 18px rgba(60,20,20,.07);
  --fd:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --fb:'Figtree','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#A50E0E; --brand-deep:#3A0A0B; --brand-text:#FF9C92; --brand-soft:#3B1516; --on-brand:#FFFFFF;
  --bg:#150E0F; --surface:#201516; --surface-2:#2B1E1F; --ink:#F7EDEB; --ink-2:#CDBBB8; --ink-3:#9A8782; --line:#3B2B2C;
  --save:#5FD39A; --save-soft:#16311F; --warn:#F0B35A; --warn-soft:#38280F; --bad:#FF8F86; --bad-soft:#40181A;
  --page:#0C0707; --logo:#FFFFFF; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#A50E0E; --brand-deep:#3A0A0B; --brand-text:#FF9C92; --brand-soft:#3B1516; --on-brand:#FFFFFF;
  --bg:#150E0F; --surface:#201516; --surface-2:#2B1E1F; --ink:#F7EDEB; --ink-2:#CDBBB8; --ink-3:#9A8782; --line:#3B2B2C;
  --save:#5FD39A; --save-soft:#16311F; --warn:#F0B35A; --warn-soft:#38280F; --bad:#FF8F86; --bad-soft:#40181A;
  --page:#0C0707; --logo:#FFFFFF; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.4;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--fd);margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand-text);outline-offset:2px}

/* page shell (desktop) */
#shell{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 16px 24px}
#topbar{width:100%;max-width:1180px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:7px 14px;border-radius:999px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--brand);color:var(--on-brand)}
#stage{width:100%;max-width:1180px;display:flex;gap:28px;justify-content:center;align-items:flex-start}
#guide{width:340px;flex:none;display:flex;flex-direction:column;gap:12px;position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;padding-right:4px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.gcard h3{font-size:15px;margin-bottom:8px}
.gcard p,.gcard li{color:var(--ink-2);font-size:13px}
.gcard ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.jumps{display:flex;flex-wrap:wrap;gap:6px}
.jumps button{padding:6px 10px;border-radius:999px;background:var(--surface-2);font-size:12.5px;font-weight:600}
.jumps button:hover{background:var(--brand-soft);color:var(--brand-text)}
#phone{width:390px;height:844px;flex:none;background:var(--bg);border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;
  box-shadow:0 0 0 10px #1a1112,0 0 0 11px #3b2b2c,0 30px 60px rgba(40,10,10,.35)}
#sbar{height:44px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;font-weight:700;font-size:13px}
#screen{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 16px 24px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@media (max-width:1020px){#guide{display:none}}
@media (min-width:521px) and (max-height:940px){#phone{height:calc(100vh - 92px);min-height:520px}}
@media (max-width:520px){
  #shell{padding:0;gap:0;height:100%}#topbar{display:none}#stage{display:block;height:100%}
  #phone{width:100%;height:100%;border-radius:0;box-shadow:none}
  #sbar{display:none}
  #screen{padding-top:env(safe-area-inset-top,0px)}
}

/* app chrome */
.logo{display:inline-block;background:var(--logo);-webkit-mask:var(--logo-img) center/contain no-repeat;mask:var(--logo-img) center/contain no-repeat;aspect-ratio:420/355;flex:none}
.wm{font-family:var(--fd);font-weight:800;letter-spacing:-.02em}
.wm i{font-style:normal;color:var(--brand-text)}
.appbar{display:flex;align-items:center;gap:10px;padding:8px 16px 10px;flex:none}
.appbar h2{font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;position:relative;flex:none}
.ib svg{width:20px;height:20px}
.badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--brand);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-family:var(--fd);flex:none}
.avatar.sm{width:30px;height:30px;font-size:12px}
#nav{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:10.5px;font-weight:600;color:var(--ink-3)}
#nav button svg{width:23px;height:23px}
#nav button.on{color:var(--brand-text)}
.cta{flex:none;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:12px 16px;font-weight:700;background:var(--brand);color:var(--on-brand);text-align:center}
.btn.block{width:100%}
.btn.sec{background:var(--brand-soft);color:var(--brand-text)}
.btn.out{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:8px 12px;border-radius:11px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.pill.save{background:var(--save-soft);color:var(--save)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.brand{background:var(--brand-soft);color:var(--brand-text)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-weight:600;font-size:13px;color:var(--ink-2)}
.inp{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);outline:none}
.inp:focus{border-color:var(--brand-text)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:0 12px}
.search input{flex:1;border:0;background:none;padding:12px 0;outline:none;min-width:0}
.search svg{width:19px;height:19px;color:var(--ink-3);flex:none}

/* cards & blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.flat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.soft{background:var(--surface-2);border-radius:14px;padding:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:20px 0 10px}
.sec-h h3{font-size:17px}.sec-h button{color:var(--brand-text);font-weight:700;font-size:13px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.col{display:flex;flex-direction:column}.g4{gap:4px}.g8{gap:8px}.g12{gap:12px}
.mut{color:var(--ink-2)}.mut3{color:var(--ink-3)}.small{font-size:12.5px}.tiny{font-size:11.5px}.b{font-weight:700}
.strike{text-decoration:line-through;color:var(--ink-3)}
.save-t{color:var(--save)}.bad-t{color:var(--bad)}.brand-t{color:var(--brand-text)}
.hr{height:1px;background:var(--line);margin:12px 0}
.bar{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px;background:var(--brand);transition:width .5s}
.bar.g>i{background:var(--save)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}.kv span:first-child{color:var(--ink-2)}.kv b{text-align:right}
.kv.tot{border-top:1.5px solid var(--ink);border-bottom:0;margin-top:4px;padding-top:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .v{font-family:var(--fd);font-size:20px;font-weight:800;margin-top:2px}
.stat .l{font-size:12px;color:var(--ink-2)}
.note{display:flex;gap:10px;padding:12px;border-radius:14px;background:var(--warn-soft);color:var(--warn);font-size:12.5px;font-weight:500}
.note.info{background:var(--brand-soft);color:var(--brand-text)}.note.ok{background:var(--save-soft);color:var(--save)}.note.bad{background:var(--bad-soft);color:var(--bad)}
.note svg{width:18px;height:18px;flex:none;margin-top:1px}
.hero{background:var(--brand);color:#fff;border-radius:22px;padding:18px;position:relative;overflow:hidden}
.hero .logo{position:absolute;right:-26px;bottom:-30px;width:150px;opacity:.13;--logo:#fff}
.hero h1{font-size:25px;letter-spacing:-.02em}
.hero p{opacity:.9;margin-top:6px;font-size:13px;max-width:260px}
.hero .btn{background:#fff;color:var(--brand)}
.hero .btn.ghost{background:rgba(255,255,255,.16);color:#fff}
.steps3{display:flex;gap:8px;margin-top:14px;position:relative}
.steps3 div{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:8px;font-size:11.5px;font-weight:600;line-height:1.25}
.steps3 b{display:block;font-family:var(--fd);font-size:15px}
.hs{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}.hs>*{scroll-snap-align:start}
.gc{width:236px;flex:none;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column}
.gc.full{width:auto}
.gc .im{position:relative;aspect-ratio:16/10;display:grid;place-items:center}
.gc .im svg{height:80%;width:auto}
.gc .tag{position:absolute;top:8px;left:8px}.gc .tag2{position:absolute;top:8px;right:8px}
.gc .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.gc h4{font-size:14.5px}
.price{font-family:var(--fd);font-weight:800;font-size:19px;letter-spacing:-.02em}
.tile{border-radius:14px;display:grid;place-items:center;overflow:hidden;flex:none}
.tile svg{width:78%;height:78%}
.li{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.li .tile{width:62px;height:62px}
.li .mid{flex:1;min-width:0}
.li h4{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:18px;height:18px;color:var(--ink-3);flex:none}
.stack{display:flex;flex-direction:column;gap:10px}
.lst>*+*{border-top:1px solid var(--line)}
.lst>*{padding:12px 0}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:13px 0;text-align:left;font-weight:600;border-bottom:1px solid var(--line)}
.menu button:last-child{border-bottom:0}
.menu .mi{width:34px;height:34px;border-radius:10px;background:var(--brand-soft);color:var(--brand-text);display:grid;place-items:center;flex:none}
.menu .mi svg{width:18px;height:18px}.menu span.t{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:8px 12px;border-radius:10px;font-weight:700;font-size:13px;color:var(--ink-2);white-space:nowrap;background:var(--surface-2)}
.tabs button.on{background:var(--brand);color:#fff}
.tabs button em{font-style:normal;opacity:.75;margin-left:4px}

/* tier ladder */
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-items:end;margin-top:6px}
.ladder .st{display:flex;flex-direction:column;gap:3px;align-items:stretch;text-align:center}
.ladder .blk{border-radius:10px 10px 4px 4px;background:var(--surface-2);display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:11px;font-weight:700;color:var(--ink-2)}
.ladder .st.cur .blk{background:var(--brand);color:#fff}
.ladder .st.past{opacity:.45}
.ladder .p{font-size:12px;font-weight:700}.ladder .d{font-size:11px;color:var(--ink-2)}
.seatrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.seatrow:last-child{border-bottom:0}
.seatrow .mid{flex:1;min-width:0}
.seat-open{border:1.5px dashed var(--line);border-radius:12px;padding:10px;color:var(--ink-3);text-align:center;font-size:12.5px}

/* option cards, stepper, steps */
.opt{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.opt.on{border-color:var(--brand-text);background:var(--brand-soft)}
.opt .mi{width:38px;height:38px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.opt.on .mi{background:var(--brand);color:#fff}.opt .mi svg{width:20px;height:20px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:38px;height:38px;border-radius:12px;background:var(--surface-2);font-size:20px;font-weight:700}
.stepper b{min-width:44px;text-align:center;font-family:var(--fd);font-size:20px}
.prog{display:flex;gap:5px;padding:0 16px 10px;flex:none}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--surface-2)}.prog i.on{background:var(--brand)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2)}
.check input{width:20px;height:20px;accent-color:var(--brand);flex:none;margin-top:1px}
.tog{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:.2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.tog.on{background:var(--save)}.tog.on::after{left:21px}
.tl{display:flex;flex-direction:column;gap:0}
.tl .s{display:flex;gap:12px;position:relative;padding-bottom:14px}
.tl .s:last-child{padding-bottom:0}
.tl .s::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}
.tl .s:last-child::before{display:none}
.tl .dot{width:22px;height:22px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none;font-size:11px;font-weight:700;color:var(--ink-3)}
.tl .s.done .dot{background:var(--save);color:#fff}.tl .s.now .dot{background:var(--brand);color:#fff}
.tl .dot svg{width:12px;height:12px}

/* overlay: sheet, toast */
#ovl{position:absolute;inset:0;z-index:30;background:rgba(20,8,8,.5);display:flex;align-items:flex-end}
#ovl[hidden]{display:none}
.sheet{width:100%;max-height:88%;background:var(--bg);border-radius:24px 24px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
#toast{position:absolute;left:16px;right:16px;bottom:88px;z-index:40;background:#241617;color:#fff;border-radius:14px;padding:12px 14px;font-weight:600;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;gap:8px;align-items:center}
#toast[hidden]{display:none}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--brand);animation:sp .8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.okc{width:72px;height:72px;border-radius:50%;background:var(--save-soft);color:var(--save);display:grid;place-items:center;margin:0 auto}
.okc svg{width:36px;height:36px}
.nt{display:flex;gap:12px;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.nt.un{border-color:var(--brand-text);background:var(--brand-soft)}
.nt .mi{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none}
.nt .mi svg{width:18px;height:18px}
.slide{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 12px}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:7px;height:7px;border-radius:4px;background:var(--line)}.dots i.on{width:22px;background:var(--brand)}
.acc summary{font-weight:700;padding:12px 0;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.acc summary::-webkit-details-marker{display:none}
.acc p{padding:0 0 12px;color:var(--ink-2);font-size:13px}
.acc{border-bottom:1px solid var(--line)}

/* admin */
#admin{width:100%;max-width:1180px;display:none;gap:16px;flex-direction:column}
#admin h1{font-size:26px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.adm{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.adm{grid-template-columns:minmax(0,1fr)}}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--ink-3);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line)}
.tw{overflow-x:auto}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%}
.bars i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--brand)}

const elapsedG=g=>g.done?g.doneElapsed:S.day-g.startedAt;

const myM=g=>g.members.find(m=>m.me);
const tgtM=(m,g)=>base(P(g.pid))+(m.extra||0);
const gTarget=g=>g.members.reduce((a,m)=>a+tgtM(m,g),0)+Math.max(0,g.min-g.members.length)*base(P(g.pid));
const gPaid=g=>g.members.reduce((a,m)=>a+m.paid,0);
const gPct=g=>Math.min(100,Math.round(gPaid(g)/gTarget(g)*100));
const gStatus=g=>g.done?'completed':g.members.length<g.min?'pending':'active';
const daysLeft=g=>g.startedAt+g.dur-S.day;
const myBal=g=>{const m=myM(g);return m?Math.max(0,tgtM(m,g)-m.paid):0};
const fundedAll=g=>g.members.length>=g.min&&g.members.every(m=>m.paid>=tgtM(m,g));
const needsAttn=g=>{const m=myM(g);if(!m||g.done)return false;return !!(g.withdrawal&&g.withdrawal.status!=='resolved')||(daysLeft(g)<=3&&myBal(g)>0)};

const av=(name,me,sm)=>`<div class="avatar ${sm?'sm':''}" style="${me?'':'background:hsl('+hue(name)+' 38% 38%)'}">${esc(ini(name))}</div>`;

const unread=()=>S.notifs.filter(n=>!n.read).length;
const bell=()=>`<button class="ib" data-a="go" data-v="notifs" aria-label="Notifications">${ic('bell')}${unread()?`<span class="badge">${unread()}</span>`:''}</button>`;
const timeLeft=g=>{const d=daysLeft(g);return d>0?d+' day'+(d>1?'s':'')+' left':d===0?'Ends today':'Past target date'};
const statusPill=g=>{const s=gStatus(g);return s==='completed'?'<span class="pill save">Completed</span>':s==='pending'?'<span class="pill warn">Filling seats</span>':'<span class="pill brand">Active</span>'};

function gcard(g,full){
  const p=P(g.pid),pr=curPrice(g),n=g.members.length,mine=!!myM(g);
  return `<div class="gc ${full?'full':''}" data-a="openGroup" data-v="${g.id}" role="button" tabindex="0">
    <div class="im" style="background:${p.bg}">${art(ART_KEY[p.id])}<span class="tag pill save">${offPct(p,pr)}% off</span><span class="tag2 pill ${daysLeft(g)<=3?'warn':''}">${ic('clock',12)} ${timeLeft(g)}</span></div>

        <div class="tiny mut" style="text-align:right"><b class="num">${n}</b> of ${g.min} joined</div></div>
      ${bar(gPct(g))}<div class="row between tiny mut"><span class="num">${gPct(g)}% funded</span><span>${g.vis==='private'?'Private':'Public'}</span></div>
      ${mine?`<button class="btn sec sm block" data-a="openGroup" data-v="${g.id}">View my group</button>`:`<button class="btn sm block" data-a="joinG" data-v="${g.id}">Join Group</button>`}
    </div></div>`;
}
function lrow(g){
  const p=P(g.pid),pr=curPrice(g),mine=!!myM(g);
  return `<div class="li" data-a="openGroup" data-v="${g.id}" role="button" tabindex="0">${tile(p)}
    <div class="mid"><h4>${esc(g.name)}</h4><div class="tiny mut">${esc(p.name)}</div>
      <div class="row g8" style="margin:3px 0;flex-wrap:wrap"><b class="num">${fmt(pr)}</b><span class="strike tiny num">${fmt(p.retail)}</span><span class="pill save">${offPct(p,pr)}% off</span></div>
      ${bar(gPct(g))}<div class="row between tiny mut" style="margin-top:3px"><span class="num">${g.members.length}/${g.min} joined · ${gPct(g)}%</span><span>${timeLeft(g)}</span></div></div>
    ${mine?'<span class="pill brand">Joined</span>':`<button class="btn sm" data-a="joinG" data-v="${g.id}">Join</button>`}</div>`;
}
function ptile(p){
  const open=S.groups.filter(g=>g.pid===p.id&&!g.done&&g.vis==='public').length;
  return `<button class="gc full" data-a="openProduct" data-v="${p.id}" style="align-items:stretch">
    <div class="im" style="background:${p.bg};aspect-ratio:4/3">${art(ART_KEY[p.id])}<span class="tag pill save">Up to ${offPct(p,bestPrice(p))}% off</span></div>
    <div class="bd"><h4 style="font-size:13.5px">${esc(p.name)}</h4><div><span class="tiny mut">Group price from</span><div class="price num" style="font-size:17px">${fmt(bestPrice(p))}</div><span class="strike tiny num">${fmt(p.retail)}</span></div>
    <span class="tiny brand-t b">${open} open group${open===1?'':'s'}</span></div></button>`;
}
function ladder(p,g){
  const e=g?elapsedG(g):null,maxSave=p.retail-tierPrice(p,TIERS[0]);
  const cur=g?TIERS.find(t=>e<=t.d):null;
  return `<div class="ladder">${TIERS.map(t=>{const pr=tierPrice(p,t),save=p.retail-pr,h=34+Math.round(save/maxSave*58);
    const past=g&&e>t.d,isCur=g&&cur&&cur.d===t.d;
    return `<div class="st ${past?'past':''} ${isCur?'cur':''}"><div class="p num">${fmt(pr)}</div><div class="blk" style="height:${h}px">${isCur?'Now':offPct(p,pr)+'%'}</div><div class="d">${g?(past?'Missed':'By '+dstr(g.startedAt+t.d)):'Within '+t.d+' days'}</div></div>`}).join('')}</div>`;
}

/* ---------- Discover ---------- */
function filterGroups(){
  const f=UI.f,q=f.q.trim().toLowerCase();
  return S.groups.filter(g=>{if(g.done||g.vis!=='public')return false;const p=P(g.pid),pr=curPrice(g),dl=daysLeft(g),pc=gPct(g),d=offPct(p,pr);
    if(f.cat!=='All'&&p.cat!==f.cat)return false;if(q&&!(g.name+' '+p.name+' '+p.cat).toLowerCase().includes(q))return false;
    if(f.price==='lt'&&pr>=200000)return false;if(f.price==='mid'&&(pr<200000||pr>600000))return false;if(f.price==='hi'&&pr<=600000)return false;
    if(f.disc&&d<+f.disc)return false;if(f.prog==='lt50'&&pc>=50)return false;if(f.prog==='mid'&&(pc<50||pc>=80))return false;if(f.prog==='hi'&&pc<80)return false;
    if(f.time==='3'&&dl>3)return false;if(f.time==='7'&&dl>7)return false;if(f.time==='8'&&dl<=7)return false;return true});
}

function scGroup(r){
  const g=getG(r.gid);if(!g)return '<div class="scroll"><p>Group not found.</p></div>';
  const p=P(g.pid),me=myM(g),pr=curPrice(g),tg=gTarget(g),pd=gPaid(g),tier=tierOf(g),empty=Math.max(0,g.min-g.members.length);
  const next=TIERS.find(t=>elapsedG(g)<=t.d);const nextDrop=next&&!g.done?TIERS[TIERS.indexOf(next)-1]:null;
  const ready=fundedAll(g);
  const w=g.withdrawal;
  return `${appbar(g.name,{right:`<button class="ib" data-a="sheet" data-v="invite" data-gid="${g.id}" aria-label="Invite">${ic('share')}</button>`})}
  <div class="scroll" style="padding-top:0">
    <div class="card"><div class="row g12">${tsz(p,72)}<div style="min-width:0"><div class="row g8" style="flex-wrap:wrap">${statusPill(g)}<span class="pill">${ic(g.vis==='public'?'globe':'lock',12)} ${g.vis==='public'?'Public':'Private'}</span></div>
      <h3 style="font-size:17px;margin-top:6px">${esc(p.name)}</h3><div class="tiny mut">Created by ${g.creator===S.user.name?'you':esc(g.creator)}</div></div></div>
      <div class="hr"></div>
      <div class="row between" style="align-items:flex-end"><div><div class="tiny mut">${g.done?'Final confirmed price':'Current group price'}</div><div class="price num" style="font-size:26px">${fmt(pr)}</div><div class="tiny mut"><span class="strike num">${fmt(p.retail)}</span> retail · <b class="save-t">${offPct(p,pr)}% off</b></div></div>
        <div style="text-align:right"><div class="tiny mut">${g.done?'Completed':'Deadline'}</div><div class="b">${g.done?'in '+g.doneElapsed+' days':dstr(g.startedAt+g.dur)}</div><div class="tiny ${daysLeft(g)<=3&&!g.done?'bad-t':'mut'}">${g.done?'':timeLeft(g)}</div></div></div></div>
    <div class="card" style="margin-top:12px"><div class="row between"><b>Group funding</b><b class="num">${gPct(g)}%</b></div><div style="margin:8px 0">${bar(gPct(g),g.done?'g':'')}</div>
      <div class="grid2" style="margin-top:10px"><div><div class="tiny mut">Contributions received</div><div class="b num" style="font-size:16px">${fmt(pd)}</div></div><div><div class="tiny mut">Group contribution target</div><div class="b num" style="font-size:16px">${fmt(tg)}</div></div>
      <div><div class="tiny mut">Remaining amount</div><div class="b num" style="font-size:16px">${fmt(Math.max(0,tg-pd))}</div></div><div><div class="tiny mut">Participants</div><div class="b num" style="font-size:16px">${g.members.length} of ${g.min} needed</div></div></div>
      ${g.max?`<div class="tiny mut" style="margin-top:8px">Up to ${g.max} participants allowed.</div>`:''}</div>
    ${me?`<div class="card" style="margin-top:12px;border-color:var(--brand-text)"><div class="b" style="margin-bottom:6px">Your contribution</div>
      <div class="kv"><span>Your target</span><b class="num">${fmt(tgtM(me,g))}</b></div><div class="kv"><span>Paid so far</span><b class="num save-t">${fmt(me.paid)}</b></div><div class="kv"><span>Outstanding balance</span><b class="num">${fmt(myBal(g))}</b></div>
      <div style="margin-top:6px">${bar(Math.min(100,Math.round(me.paid/tgtM(me,g)*100)),me.paid>=tgtM(me,g)?'g':'')}</div></div>`:''}
    ${w&&w.status!=='resolved'?`<div class="note bad" style="margin-top:12px">${ic('swap')}<div><b>${esc(w.who)} has asked to withdraw.</b> Remaining members must agree how to cover the balance.<br><button class="b" style="text-decoration:underline;margin-top:4px" data-a="go" data-v="withdraw" data-gid="${g.id}">${w.who==='You'?'View my withdrawal':'Review request'}</button></div></div>`:''}
    <div class="sec-h"><h3>Time-based price</h3></div><div class="card">${g.done?'<p class="small mut">This group completed in '+g.doneElapsed+' days, which set the final price above.</p>':`<p class="small mut" style="margin-bottom:4px">${tier?`Complete within <b>${tier.d-elapsedG(g)} more day${tier.d-elapsedG(g)===1?'':'s'}</b> to hold <b class="num">${fmt(pr)}</b>.`:'The 30-day window has passed, so the standard group price applies.'}</p>${ladder(p,g)}<p class="tiny mut" style="margin-top:8px">A lower price applies only if every participant has paid in full by that day.</p>`}</div>
    ${g.done?`<div class="sec-h"><h3>Delivery</h3></div><div class="card"><div class="tl">${STAGES.map((s,i)=>`<div class="s ${i<g.stage?'done':i===g.stage?'now':''}"><div class="dot">${i<g.stage?ic('check'):i+1}</div><div><div class="b">${s}</div><div class="tiny mut">${['All participants paid in full','Order placed with the supplier','On the way to your pickup point','Collect or receive at your address'][i]}</div></div></div>`).join('')}</div></div>`:''}
    ${ready&&!g.done?`<div class="note ok" style="margin-top:12px">${ic('check')}<span>Everyone has paid in full. Confirm the group to place the order.</span></div><button class="btn block" style="margin-top:8px" data-a="finalize" data-v="${g.id}">Confirm and place order</button>`:''}
    <div class="sec-h"><h3>Participants</h3><span class="tiny mut">${g.members.length} joined${empty?`, ${empty} more needed`:''}</span></div>
    <div class="card" style="padding:4px 14px">${g.members.map(m=>{const t=tgtM(m,g),pc=Math.min(100,Math.round(m.paid/t*100));return `<div class="seatrow">${av(m.name,m.me,1)}<div class="mid"><div class="row between"><b class="small">${m.me?'You':esc(m.name)}${m.name===g.creator?' <span class="pill" style="margin-left:4px">Creator</span>':''}</b><span class="tiny mut num">${pc}%</span></div>${bar(pc,pc>=100?'g':'')}${S.priv.hideAmounts&&!m.me?'':`<div class="tiny mut num" style="margin-top:2px">${fmt(m.paid)} of ${fmt(t)}</div>`}</div></div>`}).join('')}
      ${empty&&!g.done?`<div class="seat-open" style="margin:10px 0">${empty} open seat${empty>1?'s':''} · <button class="b brand-t" data-a="sheet" data-v="invite" data-gid="${g.id}">Invite</button></div>`:''}</div>
    <div class="sec-h"><h3>Group activity</h3></div><div class="card"><div class="tl">${g.activity.slice(0,5).map(a=>`<div class="s done"><div class="dot">${ic('check')}</div><div><div class="small b" style="font-weight:600">${esc(a.t)}</div><div class="tiny mut">${a.d===0?'Today':dstr(a.d)}</div></div></div>`).join('')}</div><button class="btn sec sm block" style="margin-top:12px" data-a="sheet" data-v="activity" data-gid="${g.id}">View all activity</button></div>
    ${me&&!g.done?`<div class="sec-h"><h3>Manage</h3></div><div class="grid2"><button class="btn out" data-a="sheet" data-v="invite" data-gid="${g.id}">${ic('users')}Invite Members</button><button class="btn bad" data-a="go" data-v="withdraw" data-gid="${g.id}">Leave Group</button></div>`:''}
  </div>
  ${!me&&!g.done?`<div class="cta"><button class="btn block" data-a="joinG" data-v="${g.id}">Join Group</button></div>`:me&&!g.done&&myBal(g)>0?`<div class="cta"><button class="btn block" data-a="go" data-v="contribute" data-gid="${g.id}">${ic('wallet')}Make Contribution</button></div>`:''}`;
}

/* ---------- Join ---------- */
function scJoin(r){
  const g=getG(r.gid),p=P(g.pid),pr=curPrice(g),c=UI.jn;
  const full=g.max&&g.members.length>=g.max;
  return `${appbar('Join group')}<div class="scroll" style="padding-top:0">
    <div class="card"><div class="row g12">${tsz(p,64)}<div style="min-width:0"><h3 style="font-size:17px">${esc(g.name)}</h3><div class="small mut">${esc(p.name)}</div></div></div><div class="hr"></div>
      <div class="kv"><span>Retail price</span><b class="num strike">${fmt(p.retail)}</b></div><div class="kv"><span>Current group price</span><b class="num">${fmt(pr)}</b></div>
      <div class="kv"><span>Potential discount</span><b class="save-t">${offPct(p,pr)}% off retail</b></div>
      <div class="kv tot"><span class="b" style="color:var(--ink)">Your expected contribution</span><b class="num">${fmt(base(p))}</b></div></div>
    <div class="sec-h"><h3>Group requirements</h3></div><div class="card"><div class="kv"><span>Participants</span><b class="num">${g.members.length} joined · ${g.min} needed · up to ${g.max}</b></div><div class="kv"><span>Deadline</span><b class="num">${dstr(g.startedAt+g.dur)} (${timeLeft(g)})</b></div><div class="kv"><span>Funding so far</span><b class="num">${gPct(g)}%</b></div></div>
    <div class="sec-h"><h3>Payment arrangement</h3></div><div class="card"><p class="small mut">Pay your ${fmt(base(p))} in parts of ${fmt(MIN_INSTALMENT)} or more, any time before the deadline. You choose each amount. No payment is taken when you join.</p></div>
    <div class="sec-h"><h3>Withdrawal conditions</h3></div><div class="note">${ic('info')}<span>You may leave before paying in full. A penalty of 5% of what you have paid (minimum ${fmt(2000)}) applies, the rest is refunded, and remaining members decide how to cover your balance. Illustrative terms for this prototype.</span></div>
    <label class="check" style="margin:14px 0"><input type="checkbox" id="jn_terms" data-chk="jn.terms" ${c.terms?'checked':''}>I have read the group rules and the withdrawal conditions, and I agree to take part.</label>
    ${full?'<div class="note bad">This group is full.</div>':''}</div>
  <div class="cta"><button class="btn block" data-a="confirmJoin" data-v="${g.id}" ${c.terms&&!full?'':'disabled'}>Confirm and join</button></div>`;
}

/* ---------- Contribution ---------- */
function scContribute(r){
  const g=getG(r.gid),p=P(g.pid),me=myM(g),t=tgtM(me,g),bal=myBal(g),c=UI.ct;
  const mine=S.txns.filter(x=>x.ref===g.id&&x.type==='contribution');
  const amt=+c.amt||0,after=Math.min(100,Math.round((me.paid+Math.min(amt,bal))/t*100));
  const quick=[...new Set([MIN_INSTALMENT*5,Math.round(t/4/500)*500,Math.round(t/2/500)*500,bal])].filter(x=>x>=MIN_INSTALMENT&&x<=bal).sort((a,b)=>a-b).slice(0,4);
  const bad=amt<MIN_INSTALMENT||amt>bal;
  return `${appbar('Make contribution')}<div class="scroll" style="padding-top:0">
    <div class="card"><div class="row g12">${tsz(p,54)}<div style="min-width:0"><h4>${esc(g.name)}</h4><div class="small mut">${esc(p.name)}</div></div></div><div class="hr"></div>
      <div class="kv"><span>Total expected contribution</span><b class="num">${fmt(t)}</b></div><div class="kv"><span>Amount already paid</span><b class="num save-t">${fmt(me.paid)}</b></div><div class="kv"><span>Outstanding balance</span><b class="num">${fmt(bal)}</b></div>
      <div style="margin-top:8px">${bar(Math.round(me.paid/t*100),me.paid>=t?'g':'')}</div><div class="tiny mut num" style="margin-top:4px">${Math.round(me.paid/t*100)}% of your contribution paid</div></div>
    ${bal>0?`<div class="sec-h"><h3>Choose an amount</h3></div>
    <div class="row g8" style="flex-wrap:wrap;margin-bottom:10px">${quick.map(q=>`<button class="chip ${amt===q?'on':''}" data-a="ctAmt" data-v="${q}">${fmt(q)}${q===bal?' (all)':''}</button>`).join('')}</div>
    <div class="field"><label for="ct_amt">Or enter an amount (₦)</label><input id="ct_amt" class="inp num" inputmode="numeric" data-in="ct.amt" value="${c.amt||''}" placeholder="e.g. 25000" style="font-size:20px;font-weight:700"></div>
    <div id="ctHint" class="${bad&&c.amt?'note bad':'note info'}">${ic('info')}<span>${!c.amt?`Minimum ${fmt(MIN_INSTALMENT)}, maximum ${fmt(bal)}.`:amt<MIN_INSTALMENT?`Minimum contribution is ${fmt(MIN_INSTALMENT)}.`:amt>bal?`That is more than your balance of ${fmt(bal)}.`:`After this payment: paid ${fmt(me.paid+amt)}, balance ${fmt(bal-amt)} (${after}% complete).`}</span></div>
    <div class="note" style="margin-top:10px">${ic('shield')}<span>Simulated payment. No card or bank details are requested.</span></div>`:`<div class="note ok" style="margin-top:12px">${ic('check')}<span>You have paid in full. Thank you.</span></div>`}
    <div class="sec-h"><h3>Next contribution</h3></div><div class="card"><p class="small">${bal>0?`Suggested: <b class="num">${fmt(Math.min(bal,Math.round(t/4/500)*500))}</b> by <b>${dstr(Math.min(S.day+7,g.startedAt+g.dur)-S.day)}</b>. Paying earlier helps the group finish sooner.`:'No further payments needed.'}</p></div>
    <div class="sec-h"><h3>Payment history</h3></div><div class="card" style="padding:4px 14px">${mine.length?mine.map(x=>`<div class="kv"><span>${x.d===0?'Today':dstr(x.d)}<br><span class="tiny mut3">Ref ${x.id.toUpperCase()}</span></span><b class="num">${fmt(-x.amount)}</b></div>`).join(''):'<p class="mut small" style="padding:12px 0">No payments yet.</p>'}</div></div>
  ${bal>0?`<div class="cta"><button class="btn block" data-a="ctPay" ${bad?'disabled':''} id="ctBtn">${bad?'Enter an amount':'Pay '+fmt(amt)}</button></div>`:''}`;
}
function scPaid(r){
  const g=getG(r.gid),me=myM(g),t=tgtM(me,g);
  return `<div class="scroll" style="padding-top:34px;text-align:center"><div class="okc">${ic('check')}</div><h1 style="font-size:26px;margin-top:14px">Payment successful</h1>
  <div class="price num" style="font-size:34px;margin:6px 0">${fmt(r.amt)}</div><p class="mut">added to ${esc(g.name)}</p>
  <div class="card" style="text-align:left;margin-top:16px"><div class="kv"><span>Paid so far</span><b class="num save-t">${fmt(me.paid)}</b></div><div class="kv"><span>Outstanding balance</span><b class="num">${fmt(myBal(g))}</b></div><div style="margin:6px 0">${bar(Math.round(me.paid/t*100),me.paid>=t?'g':'')}</div>
    <div class="kv"><span>Group funding</span><b class="num">${gPct(g)}%</b></div><div class="kv"><span>Reference</span><b class="num">${esc(r.ref.toUpperCase())}</b></div></div>
  ${me.paid>=t?`<div class="note ok" style="margin-top:12px">${ic('check')}<span>You have paid your full share.</span></div>`:''}
  <div class="stack" style="margin-top:16px">${myBal(g)>0?`<button class="btn block" data-a="go" data-v="contribute" data-gid="${g.id}" data-replace="1">Pay again</button>`:''}<button class="btn ${myBal(g)>0?'out':''} block" data-a="openGroupReplace" data-v="${g.id}">Back to group</button></div></div>`;
}

/* ---------- Withdrawal & replacement ---------- */
const penaltyOf=paid=>paid>0?Math.max(2000,Math.round(paid*.05/100)*100):0;
function scWithdraw(r){
  const g=getG(r.gid),me=myM(g),w=g.withdrawal,w2=UI.wd;
  if(w&&w.who!=='You'&&w.status!=='resolved'){/* another member is leaving: current user decides */
    const m=g.members.find(x=>x.name===w.who),bal=m?tgtM(m,g)-m.paid:0,others=g.members.filter(x=>x.name!==w.who),share=Math.ceil(bal/others.length/100)*100,resp=w.responses||{},my=resp.me;
    return `${appbar('Withdrawal request')}<div class="scroll" style="padding-top:0">
      <div class="card"><div class="row g12">${av(w.who,0)}<div><h4>${esc(w.who)} wants to withdraw</h4><div class="small mut">${esc(g.name)}</div></div></div><div class="hr"></div>
      <div class="kv"><span>Paid so far</span><b class="num">${fmt(w.paid)}</b></div><div class="kv"><span>Outstanding balance</span><b class="num">${fmt(bal)}</b></div><div class="kv"><span>Illustrative penalty</span><b class="num bad-t">${fmt(w.penalty)}</b></div><div class="kv"><span>Their expected refund</span><b class="num">${fmt(Math.max(0,w.paid-w.penalty))}</b></div></div>
      <div class="note info" style="margin-top:12px">${ic('shield')}<span>You are never forced to pay for someone else. The group continues only after members who take extra cost say yes.</span></div>
      <div class="sec-h"><h3>How should the ${fmt(bal)} be covered?</h3></div>
      <div class="stack"><button class="opt ${w2.opt==='A'?'on':''}" data-a="wdOpt" data-v="A"><span class="mi">${ic('users')}</span><div><h4 style="font-size:15px">Option A · Share it</h4><p class="small mut" style="margin-top:3px">Willing members split the balance. If all ${others.length} agree, about <b class="num">${fmt(share)}</b> each. Fewer members means a larger share each.</p></div></button>
      <button class="opt ${w2.opt==='B'?'on':''}" data-a="wdOpt" data-v="B"><span class="mi">${ic('swap')}</span><div><h4 style="font-size:15px">Option B · One member takes over</h4><p class="small mut" style="margin-top:3px">One volunteer takes the full <b class="num">${fmt(bal)}</b> and the other members are not charged.</p></div></button></div>
      <div class="sec-h"><h3>Members' agreement</h3></div><div class="card" style="padding:4px 14px">${others.map(m=>{const rs=m.me?my:(resp[m.name]||'');return `<div class="seatrow">${av(m.name,m.me,1)}<div class="mid"><b class="small">${m.me?'You':esc(m.name)}</b></div>${rs==='yes'?'<span class="pill save">Agreed</span>':rs==='no'?'<span class="pill bad">Declined</span>':'<span class="pill warn">Waiting</span>'}</div>`}).join('')}</div>
      ${!my?`<div class="grid2" style="margin-top:12px"><button class="btn bad" data-a="wdVote" data-v="no">Decline</button><button class="btn" data-a="wdVote" data-v="yes">${w2.opt==='A'?'Agree to share':'I will take over'}</button></div>`:`<div class="note ${my==='yes'?'ok':'bad'}" style="margin-top:12px">${ic('info')}<span>You ${my==='yes'?'agreed. Your extra share is added once the group confirms.':'declined. You pay nothing extra for this withdrawal.'}</span></div>`}
      ${Object.keys(resp).length>=others.length-1&&my?`<button class="btn block" style="margin-top:10px" data-a="wdResolve" data-v="${g.id}">Finalise arrangement</button>`:''}
    </div>`;}
  /* current user leaving */
  const paid=me.paid,bal=myBal(g),pen=penaltyOf(paid),ref=Math.max(0,paid-pen),others=g.members.filter(x=>!x.me),sh=others.length?Math.ceil(bal/others.length/100)*100:0;
  const step=w2.step;
  if(step===2){return `<div class="scroll" style="padding-top:34px;text-align:center"><div class="okc" style="background:var(--warn-soft);color:var(--warn)">${ic('swap')}</div><h1 style="font-size:24px;margin-top:14px">Withdrawal request sent</h1>
    <p class="mut" style="margin:6px 0 14px">${esc(g.name)} members must now agree on how to cover your ${fmt(bal)} balance. You stay in the group until they decide.</p>
    <div class="card" style="text-align:left"><div class="kv"><span>Refund when approved</span><b class="num">${fmt(ref)}</b></div><div class="kv"><span>Penalty</span><b class="num bad-t">${fmt(pen)}</b></div></div>
    <button class="btn block" style="margin-top:16px" data-a="openGroupReplace" data-v="${g.id}">Back to group</button></div>`}
  if(w&&w.who==='You'&&w.status!=='resolved'){return `${appbar('My withdrawal')}<div class="scroll" style="padding-top:0"><div class="note">${ic('clock')}<span>Your request is waiting for the remaining members to agree.</span></div>
    <div class="card" style="margin-top:12px"><div class="kv"><span>Option proposed</span><b>${w.option==='A'?'A · Share the balance':'B · One member takes over'}</b></div>${[...Object.entries(w.responses||{})].map(([n,v])=>`<div class="kv"><span>${esc(n)}</span><b>${v==='yes'?'Agreed':'Declined'}</b></div>`).join('')||'<p class="small mut" style="padding:8px 0">No replies yet.</p>'}</div>
    <div class="stack" style="margin-top:12px"><button class="btn sec block" data-a="wdSimAgree" data-v="${g.id}">Demo: members respond</button><button class="btn out block" data-a="wdCancel" data-v="${g.id}">Cancel withdrawal</button></div></div>`}
  return `${appbar('Leave group')}<div class="scroll" style="padding-top:0">
    <div class="note bad">${ic('info')}<span><b>Leaving early has consequences.</b> A penalty applies and the other members must cover your unpaid share.</span></div>
    <div class="card" style="margin-top:12px"><div class="b" style="margin-bottom:6px">Your position</div><div class="kv"><span>Your contributions so far</span><b class="num">${fmt(paid)}</b></div><div class="kv"><span>Outstanding balance</span><b class="num">${fmt(bal)}</b></div><div class="kv"><span>Illustrative penalty (5%, min ${fmt(2000)})</span><b class="num bad-t">−${fmt(pen)}</b></div><div class="kv tot"><span class="b" style="color:var(--ink)">Expected refund</span><b class="num">${fmt(ref)}</b></div></div>
    <div class="sec-h"><h3>What happens to the group</h3></div><div class="card"><p class="small mut">The group needs ${fmt(bal)} more to stay on target. Nobody is forced to cover it. Remaining members must vote:</p></div>
    <div class="stack" style="margin-top:10px"><button class="opt ${w2.opt==='A'?'on':''}" data-a="wdOpt" data-v="A"><span class="mi">${ic('users')}</span><div><h4 style="font-size:15px">Option A · Share it</h4><p class="small mut" style="margin-top:3px">Willing members split ${fmt(bal)}. If all ${others.length} agree, about <b class="num">${fmt(sh)}</b> each.</p></div></button>
      <button class="opt ${w2.opt==='B'?'on':''}" data-a="wdOpt" data-v="B"><span class="mi">${ic('swap')}</span><div><h4 style="font-size:15px">Option B · One member takes over</h4><p class="small mut" style="margin-top:3px">One member volunteers to take the whole ${fmt(bal)}. Others are not charged.</p></div></button></div>
    <div class="note info" style="margin-top:12px">${ic('shield')}<span>The group continues only after the members affected explicitly agree.</span></div>
    <label class="check" style="margin:14px 0"><input type="checkbox" id="wd_terms" data-chk="wd.terms" ${w2.terms?'checked':''}>I understand the penalty and that my refund is ${fmt(ref)}.</label></div>
    <div class="cta"><button class="btn block" style="background:var(--bad)" data-a="wdSubmit" data-v="${g.id}" ${w2.terms?'':'disabled'}>Request withdrawal</button></div>`;
}

/* ---------- My Groups ---------- */
const GTABS=[['active','Active'],['completed','Completed'],['pending','Pending'],['await','Awaiting payment'],['attn','Needs attention']];
function myGroups(){return S.groups.filter(g=>myM(g))}
function inTab(g,t){return t==='active'?(gStatus(g)==='active'):t==='completed'?g.done:t==='pending'?gStatus(g)==='pending':t==='await'?(!g.done&&myBal(g)>0):needsAttn(g)}
function scMyGroups(){
  const all=myGroups(),t=UI.gt,list=all.filter(g=>inTab(g,t));
  return `<div class="appbar" style="padding-top:12px"><h2 style="font-size:22px">My Groups</h2><button class="btn sm" data-a="startCreate">${ic('plus')}New</button></div>
  <div class="scroll"><div class="tabs">${GTABS.map(([k,l])=>`<button class="${t===k?'on':''}" data-a="gtab" data-v="${k}">${l}<em class="num">${all.filter(g=>inTab(g,k)).length}</em></button>`).join('')}</div>

  if(w.option==='A'){const sh=Math.ceil(bal/others.length/100)*100;others.forEach(m=>m.extra=(m.extra||0)+sh)}else{others[0].extra=(others[0].extra||0)+bal}
